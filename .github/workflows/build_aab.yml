name: Build Android App Bundle (.aab)

# Trigger ONLY on manual button click from GitHub Actions UI (NEVER on git push)
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Optional Build Number (e.g. 10). Leave blank to use pubspec.yaml version'
        required: false
        default: ''

jobs:
  build:
    name: Build Signed .aab
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Keystore and key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'sonia2028' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'sonia2028' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring upload-keystore.jks from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > examspark_frontend/android/app/upload-keystore.jks
            
            echo "Creating key.properties..."
            cat <<EOF > examspark_frontend/android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            echo "KEYSTORE_BASE64 secret not found. Using repository files if present."
          fi

      - name: Install dependencies
        working-directory: examspark_frontend
        run: flutter pub get

      - name: Build Android App Bundle (.aab)
        working-directory: examspark_frontend
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            flutter build appbundle --release --build-number=${{ github.event.inputs.build_number }}
          else
            flutter build appbundle --release
          fi

      - name: Upload .aab Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: examspark_frontend/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
