steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/examspark-backend:$COMMIT_SHA'
      - '-f'
      - 'examspark_backend/Dockerfile'
      - 'examspark_backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/examspark-backend:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'examspark-backend'
      - '--image=gcr.io/$PROJECT_ID/examspark-backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'

images:
  - 'gcr.io/$PROJECT_ID/examspark-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY