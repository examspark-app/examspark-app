<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sonaxia">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sonaxia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Sonaxia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
    }
    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash-screen.splash-hide {
      opacity: 0;
      pointer-events: none;
    }
    #splash-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #0F9D58; /* apna accent color yahan daal do */
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 700;
      font-size: 30px;
      color: #ffffff;
      margin-bottom: 22px;
      animation: splash-pulse 1.3s ease-in-out infinite;
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    #splash-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #E0E0E0;
      border-top-color: #0F9D58; /* apna accent color yahan daal do */
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }
    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash-screen">
    <div id="splash-logo">S</div>
    <div id="splash-spinner"></div>
  </div>

  <script>
    window.forceReloadExamSparkApp = function () {
      window.location.reload();
    };
  </script>
  <script>
    (function () {
      var APP_VERSION_KEY = 'examspark_app_version';
      var RELOAD_ATTEMPTED_KEY = 'examspark_reload_attempted';
      var currentVersion = 'BUILD_VERSION_PLACEHOLDER';
      try {
        var alreadyTriedThisSession = sessionStorage.getItem(RELOAD_ATTEMPTED_KEY) === '1';
        var stored = localStorage.getItem(APP_VERSION_KEY);
        var needsHardReload = !!stored && stored !== currentVersion && !alreadyTriedThisSession;
        localStorage.setItem(APP_VERSION_KEY, currentVersion);
        if (needsHardReload) {
          sessionStorage.setItem(RELOAD_ATTEMPTED_KEY, '1');
          var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              Promise.all(keys.map(function (k) { return caches.delete(k); })).finally(function () {
                window.location.replace(window.location.href + sep + 'force_refresh=1');
              });
            }).catch(function () {
              window.location.replace(window.location.href + sep + 'force_refresh=1');
            });
          } else {
            window.location.replace(window.location.href + sep + 'force_refresh=1');
          }
        }
      } catch (_) {}
    })();
  </script>

  <script>
    // Flutter web pehla frame paint kar de to ke turant baad splash hide karo.
    (function () {
      var splash = document.getElementById('splash-screen');
      if (!splash) return;
      var hidden = false;
      function hideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('splash-hide');
        setTimeout(function () { splash.remove(); }, 400);
      }
      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          hideSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      // Safety fallback — agar 12 second me bhi Flutter nahi mila to bhi hata do.
      setTimeout(hideSplash, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
