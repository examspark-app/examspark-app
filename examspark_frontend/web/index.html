<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sonaxia">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sonaxia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Sonaxia</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.forceReloadExamSparkApp = function () {
      window.location.reload();
    };
  </script>
  <script>
    (function () {
      var APP_VERSION_KEY = 'examspark_app_version';
      var RELOAD_ATTEMPTED_KEY = 'examspark_reload_attempted';
      var currentVersion = 'BUILD_VERSION_PLACEHOLDER';
      try {
        var alreadyTriedThisSession = sessionStorage.getItem(RELOAD_ATTEMPTED_KEY) === '1';
        var stored = localStorage.getItem(APP_VERSION_KEY);
        var needsHardReload = !!stored && stored !== currentVersion && !alreadyTriedThisSession;
        localStorage.setItem(APP_VERSION_KEY, currentVersion);
        if (needsHardReload) {
          sessionStorage.setItem(RELOAD_ATTEMPTED_KEY, '1');
          var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              Promise.all(keys.map(function (k) { return caches.delete(k); })).finally(function () {
                window.location.replace(window.location.href + sep + 'force_refresh=1');
              });
            }).catch(function () {
              window.location.replace(window.location.href + sep + 'force_refresh=1');
            });
          } else {
            window.location.replace(window.location.href + sep + 'force_refresh=1');
          }
        }
      } catch (_) {}
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
