<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sonaxia">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sonaxia">
  <meta name="theme-color" content="#F0384C">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="apple-touch-icon" href="images/sonaxia_logo.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Sonaxia</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f7f4f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #sonaxia-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 72px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      transition: opacity 220ms ease;
    }

    #sonaxia-shell.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #sonaxia-shell img {
      display: block;
      width: 140px;
      height: 40px;
      object-fit: contain;
    }

    #sonaxia-shell::after {
      content: "";
      width: 16px;
      height: 16px;
      margin-left: 12px;
      border-radius: 50%;
      border: 2px solid rgba(240, 56, 76, 0.2);
      border-top-color: #f0384c;
      animation: sonaxia-spin 0.9s linear infinite;
    }

    @keyframes sonaxia-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div id="sonaxia-shell" aria-live="polite" aria-label="Sonaxia loading shell">
    <img src="images/sonaxia_logo.png" alt="Sonaxia" />
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openExamSparkRazorpay = function (optionsJson) {
      return new Promise(function (resolve, reject) {
        var options = JSON.parse(optionsJson);
        options.handler = function (response) {
          resolve(JSON.stringify(response));
        };
        options.modal = {
          ondismiss: function () {
            reject(new Error('Payment cancelled'));
          }
        };
        var rzp = new Razorpay(options);
        rzp.open();
      });
    };

    function hideInitialShell() {
      var shell = document.getElementById('sonaxia-shell');
      if (shell) {
        shell.classList.add('hidden');
      }
    }

    window.addEventListener('flutter-first-frame', hideInitialShell);
    window.addEventListener('load', function () {
      setTimeout(hideInitialShell, 150);
    });

    (function () {
      var APP_VERSION_KEY = 'examspark_app_version';
      var currentVersion = 'v1.0.0-5';
      try {
        var stored = localStorage.getItem(APP_VERSION_KEY);
        if (!stored) {
          localStorage.setItem(APP_VERSION_KEY, currentVersion);
        } else if (stored !== currentVersion) {
          localStorage.setItem(APP_VERSION_KEY, currentVersion);
          if (window.location.search.indexOf('force_refresh=1') === -1) {
            var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
            window.location.replace(window.location.href + sep + 'force_refresh=1');
          }
        }
      } catch (e) {}
    })();

    window.forceReloadExamSparkApp = function () {
      try {
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            Promise.all(keys.map(function (k) { return caches.delete(k); })).finally(function () {
              doHardReload();
            });
          }).catch(function () { doHardReload(); });
        } else {
          doHardReload();
        }
      } catch (e) {
        doHardReload();
      }
      function doHardReload() {
        var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
        window.location.replace(window.location.href + sep + 'v=' + Date.now());
      }
    };
  </script>
  <script src="flutter_bootstrap.js?v=1005" async></script>
</body>
</html>
