<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sonaxia">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sonaxia">
  <meta name="theme-color" content="#F0384C">

  <!-- Aggressive no-cache headers — required for Cloudflare CDN -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0, s-maxage=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Clear-Site-Data" content="cache, storage">

  <link rel="apple-touch-icon" href="images/sonaxia_logo.png?v=1007">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=1007"/>
  <link rel="icon" type="image/png" href="favicon.png?v=1007"/>
  <title>Sonaxia</title>
  <link rel="manifest" href="manifest.json?v=1007">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #f7f4f2;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow: hidden;
    }

    #sonaxia-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 72px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      transition: opacity 220ms ease;
    }

    #sonaxia-shell.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #sonaxia-shell img {
      display: block;
      width: 140px;
      height: 40px;
      object-fit: contain;
    }

    #sonaxia-shell::after {
      content: "";
      width: 16px;
      height: 16px;
      margin-left: 12px;
      border-radius: 50%;
      border: 2px solid rgba(240, 56, 76, 0.2);
      border-top-color: #f0384c;
      animation: sonaxia-spin 0.9s linear infinite;
    }

    @keyframes sonaxia-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <!-- SYNCED VERSION BUMP — matches pubspec.yaml version: 1.0.0+7 -->
  <!-- CRITICAL: Unregister service workers & clear caches BEFORE loading flutter_bootstrap.js.
       This fixes the service-worker catch-22 where a stale SW would serve a stale HTML
       even after a Cloudflare cache purge. Runs synchronously as early as possible. -->
  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              try { registrations[i].unregister(); } catch (_) {}
            }
          }).catch(function () {});
        }
      } catch (_) {}
      try {
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            for (var i = 0; i < keys.length; i++) {
              try { caches.delete(keys[i]); } catch (_) {}
            }
          }).catch(function () {});
        }
      } catch (_) {}
      try {
        if (window.indexedDB && typeof indexedDB.databases === 'function') {
          indexedDB.databases().then(function (dbs) {
            for (var i = 0; i < dbs.length; i++) {
              try { indexedDB.deleteDatabase(dbs[i].name); } catch (_) {}
            }
          }).catch(function () {});
        }
      } catch (_) {}
    })();

    (function () {
      var APP_VERSION_KEY = 'examspark_app_version';
      // MUST match pubspec.yaml version exactly (v{version}+{buildNumber})
      var currentVersion = 'v1.0.0+7';
      var needsHardReload = false;
      try {
        var stored = localStorage.getItem(APP_VERSION_KEY);
        if (!stored) {
          localStorage.setItem(APP_VERSION_KEY, currentVersion);
        } else if (stored !== currentVersion) {
          localStorage.setItem(APP_VERSION_KEY, currentVersion);
          needsHardReload = true;
        }
      } catch (e) {}
      try {
        var hasForce = window.location.search.indexOf('force_refresh=1') !== -1 ||
                       window.location.search.indexOf('v=') !== -1;
        if (needsHardReload && !hasForce) {
          var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
          try {
            if ('caches' in window) {
              caches.keys().then(function (keys) {
                Promise.all(keys.map(function (k) { return caches.delete(k); })).finally(function () {
                  window.location.replace(window.location.href + sep + 'force_refresh=1');
                });
              }).catch(function () {
                window.location.replace(window.location.href + sep + 'force_refresh=1');
              });
            } else {
              window.location.replace(window.location.href + sep + 'force_refresh=1');
            }
            return;
          } catch (_) {
            window.location.replace(window.location.href + sep + 'force_refresh=1');
            return;
          }
        }
      } catch (_) {}
    })();

    window.forceReloadExamSparkApp = function () {
      function doHardReload() {
        var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
        try {
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              Promise.all(keys.map(function (k) { return caches.delete(k); })).finally(function () {
                window.location.replace(window.location.href + sep + 'v=' + Date.now());
              });
            }).catch(function () {
              window.location.replace(window.location.href + sep + 'v=' + Date.now());
            });
          } else {
            window.location.replace(window.location.href + sep + 'v=' + Date.now());
          }
        } catch (_) {
          window.location.replace(window.location.href + sep + 'v=' + Date.now());
        }
      }
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (var i = 0; i < registrations.length; i++) {
              try { registrations[i].unregister(); } catch (_) {}
            }
            doHardReload();
          }).catch(doHardReload);
        } else {
          doHardReload();
        }
      } catch (e) {
        doHardReload();
      }
    };
  </script>

  <div id="sonaxia-shell" aria-live="polite" aria-label="Sonaxia loading shell">
    <img src="images/sonaxia_logo.png?v=1007" alt="Sonaxia" />
  </div>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openExamSparkRazorpay = function (optionsJson) {
      return new Promise(function (resolve, reject) {
        var options = JSON.parse(optionsJson);
        options.handler = function (response) {
          resolve(JSON.stringify(response));
        };
        options.modal = {
          ondismiss: function () {
            reject(new Error('Payment cancelled'));
          }
        };
        var rzp = new Razorpay(options);
        rzp.open();
      });
    };

    function hideInitialShell() {
      var shell = document.getElementById('sonaxia-shell');
      if (shell) {
        shell.classList.add('hidden');
      }
    }

    window.addEventListener('flutter-first-frame', hideInitialShell);
    window.addEventListener('load', function () {
      setTimeout(hideInitialShell, 150);
    });
  </script>
  <!-- Cache-bust the Flutter bootstrap loader — bump ?v= every build to bypass Cloudflare -->
  <script src="flutter_bootstrap.js?v=1007" async></script>
</body>
</html>
