  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
    }
    #splash-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash-screen.splash-hide {
      opacity: 0;
      pointer-events: none;
    }

    /* Wrapper just holds the ripple rings + the logo, so the ripple can be
       centered independently of the logo's own pulse animation. */
    #splash-logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    /* The logo itself: full circle, image fills it, and it pulses
       (scales in/out) continuously. */
    #splash-logo {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 2;
      box-shadow: 0 4px 14px rgba(230, 0, 122, 0.25);
      animation: splash-pulse 1.6s ease-in-out infinite;
    }
    #splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    @keyframes splash-pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }
    
    /* Two circular rings pulse outward from behind the logo and fade —
       radar-ping style, staggered so a new ring starts before the last one
       finishes. Sits on the wrapper so it stays centered on the circle. */
    #splash-logo-wrap::before,
    #splash-logo-wrap::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 72px;
      height: 72px;
      margin: -36px 0 0 -36px;
      border-radius: 22px;
      border: 2px solid #E6007A; /* logo ka pink shade */
      opacity: 0;
      z-index: 1;
      animation: splash-ripple 2s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
    }
    #splash-logo-wrap::after {
      border-color: #FF7A00; /* logo ka orange shade */
      animation-delay: 1s;
    }
    @keyframes splash-ripple {
      0% {
        transform: scale(1);
        opacity: 0.55;
      }
      100% {
        transform: scale(2.1);
        opacity: 0;
      }
    }

  </style>

  <script>
    window.forceReloadExamSparkApp = function () {

    };
  </script>
  <script>
    (function () {
      var APP_VERSION_KEY = 'examspark_app_version';
      var RELOAD_ATTEMPTED_KEY = 'examspark_reload_attempted';
      var currentVersion = 'BUILD_VERSION_PLACEHOLDER';
      try {
        var alreadyTriedThisSession = sessionStorage.getItem(RELOAD_ATTEMPTED_KEY) === '1';
        var stored = localStorage.getItem(APP_VERSION_KEY);
        var needsHardReload = !!stored && stored !== currentVersion && !alreadyTriedThisSession;
        localStorage.setItem(APP_VERSION_KEY, currentVersion);
        if (needsHardReload) {
          sessionStorage.setItem(RELOAD_ATTEMPTED_KEY, '1');
          var sep = window.location.href.indexOf('?') === -1 ? '?' : '&';
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              Promise.all(keys.map(function (k) { return caches.delete(k); })).finally(function () {
                window.location.replace(window.location.href + sep + 'force_refresh=1');
              });
            }).catch(function () {
              window.location.replace(window.location.href + sep + 'force_refresh=1');
            });
          } else {
            window.location.replace(window.location.href + sep + 'force_refresh=1');
          }
        }
      } catch (_) {}
    })();
  </script>

  <script>
    // Flutter web pehla frame paint kar de to ke turant baad splash hide karo.
    (function () {
      var splash = document.getElementById('splash-screen');
      if (!splash) return;
      var hidden = false;
      function hideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('splash-hide');
        setTimeout(function () { splash.remove(); }, 400);
      }
      var observer = new MutationObserver(function () {
        if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
          hideSplash();
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      // Safety fallback — agar 12 second me bhi Flutter nahi mila to bhi hata do.
      setTimeout(hideSplash, 12000);
    })();
  </script>
